<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank AI</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="app-bar">
        <img src="/assets/icon.svg" alt="" />
        <strong>Bank AI <small id="app-version"></small></strong>
      </header>

      <div class="content">
        <section class="hero">
          <div class="hero-copy">
            <span class="eyebrow">WORD ASSISTANT</span>
            <h1>Bank AI</h1>
            <p>Ускорьте работу с документами с помощью AI-ассистента.</p>
          </div>
          <img class="hero-image" src="/assets/assistant-hero.png" alt="Документ с AI-помощником" />
        </section>

        <section class="section-block" aria-labelledby="actions-title">
          <h2 id="actions-title" class="section-title">Быстрые действия</h2>
          <div id="actions" class="actions" aria-label="AI-действия"></div>
        </section>

        <section class="section-block" aria-labelledby="status-title">
          <h2 id="status-title" class="section-title">Состояние</h2>
          <div class="status-card">
            <span class="status-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m6.5 12.5 3.5 3.5 7.5-8" /></svg>
            </span>
            <div>
              <strong id="status-heading">Готово к работе</strong>
              <p id="status" class="status" role="status">Выделите текст в документе и выберите действие.</p>
            </div>
          </div>
        </section>

        <section id="preview" class="section-block preview is-empty" aria-labelledby="preview-title">
          <h2 id="preview-title" class="section-title">Сравнение изменений <span class="info" title="Проверьте результат перед применением">i</span></h2>
          <div class="comparison-card">
            <h3>Было</h3>
            <p id="original" data-placeholder="Здесь будет исходный текст…"></p>
          </div>
          <div class="comparison-card">
            <h3>Стало</h3>
            <p id="result" data-placeholder="Здесь будет изменённый текст…"></p>
          </div>
          <div class="decision-row">
            <button id="reject" class="secondary" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 9A8 8 0 1 1 5 16" /></svg>
              Отклонить
            </button>
            <button id="accept" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
              Применить
            </button>
          </div>
        </section>
      </div>

      <footer>
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" /></svg>Настройки</span>
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.8 9a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1.2.9-1.2 1.8M12 17h.01" /></svg>Справка</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
