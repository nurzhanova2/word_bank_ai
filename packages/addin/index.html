<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank AI</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="app-bar">
        <strong>Bank AI</strong>
        <span class="window-actions" aria-hidden="true"><span>⌄</span><span>×</span></span>
      </header>

      <div class="content">
        <section class="hero card-surface">
          <div class="hero-copy">
            <div class="brand-line">
              <img class="brand-icon" src="/assets/icon.svg" alt="" />
              <div><h1>Bank AI <small id="app-version"></small></h1><p>AI-помощник для работы с документами</p></div>
            </div>
            <div class="ready-pill"><span></span><strong id="status-heading">Готов к работе</strong></div>
            <p id="status" class="status" role="status">Выделите текст и выберите действие.</p>
          </div>
          <img class="hero-image" src="/assets/assistant-hero.png" alt="Документ с AI-помощником" />
        </section>

        <section class="section-block" aria-labelledby="actions-title">
          <h2 id="actions-title" class="section-title">Быстрые действия</h2>
          <div id="actions" class="actions" aria-label="AI-действия"></div>
        </section>

        <section class="tone-panel" aria-label="Изменение тона">
          <label for="tone-select">Тон текста</label>
          <div class="tone-actions">
            <select id="tone-select" aria-label="Тон текста">
              <option value="neutral">Нейтральный</option><option value="polite">Вежливый</option>
              <option value="strict">Строгий</option><option value="diplomatic">Дипломатичный</option>
            </select>
            <button id="tone-apply" type="button">Изменить</button>
          </div>
        </section>

        <section id="preview" class="section-block preview is-empty" aria-labelledby="preview-title">
          <h2 id="preview-title" class="section-title">Сравнение изменений <span class="info" title="Проверьте результат перед применением">i</span></h2>
          <div class="comparison-tabs" role="tablist">
            <button class="is-active" type="button" data-tab="changes">Изменения</button>
            <button type="button" data-tab="original">Было</button>
            <button type="button" data-tab="result">Стало</button>
          </div>
          <div class="comparison-card comparison-body">
            <p id="changes" data-placeholder="Здесь появится сравнение текста…"></p>
            <p id="original" hidden data-placeholder="Здесь будет исходный текст…"></p>
            <p id="result" hidden data-placeholder="Здесь будет изменённый текст…"></p>
          </div>
          <div id="grammar-meta" class="grammar-meta" hidden></div>
          <div id="grammar-issues" class="grammar-issues" hidden></div>
          <div class="decision-row">
            <button id="reject" class="secondary" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 9A8 8 0 1 1 5 16" /></svg>
              Отклонить
            </button>
            <button id="accept" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
              Применить
            </button>
          </div>
        </section>
      </div>

      <footer>
        <span>⚙ Настройки</span><span>ⓘ Справка</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
