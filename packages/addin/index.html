<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank AI</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="app-bar">
        <img src="/assets/icon.svg" alt="" />
        <strong>Bank AI</strong>
      </header>

      <div class="content">
        <section class="hero">
          <div class="hero-copy">
            <span class="eyebrow">WORD ASSISTANT</span>
            <h1>Bank AI</h1>
            <p>Ускорьте работу с документами с помощью AI-ассистента.</p>
          </div>
          <img class="hero-image" src="/assets/assistant-hero.png" alt="Документ с AI-помощником" />
        </section>

        <section class="section-block" aria-labelledby="actions-title">
          <h2 id="actions-title" class="section-title">Быстрые действия</h2>
          <div class="actions" aria-label="AI-действия">
            <button class="action-card" data-action="rewrite">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m4 16 9.8-9.8a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Zm8.4-8.4 3 3M12 20h9" /></svg>
              </span>
              <span class="action-copy"><strong>Переписать</strong><small>Улучшить структуру и формулировки текста.</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button class="action-card" data-action="shorten">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="3" /><circle cx="6" cy="17" r="3" /><path d="m8.5 8.5 11 8.5M8.5 15.5 19.5 7" /></svg>
              </span>
              <span class="action-copy"><strong>Сократить</strong><small>Сделать текст короче, сохранив суть.</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button class="action-card" data-action="summary">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 5h14M5 9h14M5 13h9M5 17h11M5 21h7" /></svg>
              </span>
              <span class="action-copy"><strong>Краткое содержание</strong><small>Выделить основные мысли и важные факты.</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button class="action-card" data-action="formalize">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6V3Z" /><path d="M15 3v5h4M9 13h7M9 17h5M9 9h2" /></svg>
              </span>
              <span class="action-copy"><strong>Формальный стиль</strong><small>Преобразовать текст в деловой стиль.</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button class="action-card" data-action="grammar">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 4h9M9.5 4v12M6.5 10h6M15 16l2.2 2.2L21 13" /></svg>
              </span>
              <span class="action-copy"><strong>Проверить грамматику</strong><small>Исправить ошибки, окончания и пунктуацию.</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <div class="action-card action-card-option">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 5h10M9 3v2c0 5-2 8-5 10M6 10c2 2 4 3 7 4M15 10l4 11M13.5 17h7" /></svg>
              </span>
              <span class="action-copy">
                <strong>Перевести</strong>
                <select id="translation-language" class="action-select" aria-label="Язык перевода">
                  <option value="ru">На русский</option>
                  <option value="kk">Қазақша</option>
                  <option value="en">To English</option>
                </select>
              </span>
              <button class="action-go" data-action="translate" type="button" aria-label="Перевести текст">›</button>
            </div>
            <button class="action-card" data-action="expand">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5M8 12h8M12 8v8" /></svg>
              </span>
              <span class="action-copy"><strong>Расширить текст</strong><small>Добавить подробности без новых фактов.</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <div class="action-card action-card-option">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4" /><circle cx="4" cy="6" r="1" /><circle cx="17" cy="12" r="1" /><circle cx="10" cy="18" r="1" /></svg>
              </span>
              <span class="action-copy">
                <strong>Изменить тон</strong>
                <select id="tone-style" class="action-select" aria-label="Тон текста">
                  <option value="neutral">Нейтральный</option>
                  <option value="polite">Вежливый</option>
                  <option value="strict">Строгий</option>
                  <option value="diplomatic">Дипломатичный</option>
                </select>
              </span>
              <button class="action-go" data-action="tone" type="button" aria-label="Изменить тон текста">›</button>
            </div>
          </div>
        </section>

        <section class="section-block" aria-labelledby="status-title">
          <h2 id="status-title" class="section-title">Состояние</h2>
          <div class="status-card">
            <span class="status-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m6.5 12.5 3.5 3.5 7.5-8" /></svg>
            </span>
            <div>
              <strong id="status-heading">Готово к работе</strong>
              <p id="status" class="status" role="status">Выделите текст в документе и выберите действие.</p>
            </div>
          </div>
        </section>

        <section id="preview" class="section-block preview is-empty" aria-labelledby="preview-title">
          <h2 id="preview-title" class="section-title">Сравнение изменений <span class="info" title="Проверьте результат перед применением">i</span></h2>
          <div class="comparison-card">
            <h3>Было</h3>
            <p id="original" data-placeholder="Здесь будет исходный текст…"></p>
          </div>
          <div class="comparison-card">
            <h3>Стало</h3>
            <p id="result" data-placeholder="Здесь будет изменённый текст…"></p>
          </div>
          <div class="decision-row">
            <button id="reject" class="secondary" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 9A8 8 0 1 1 5 16" /></svg>
              Отклонить
            </button>
            <button id="accept" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
              Применить
            </button>
          </div>
        </section>
      </div>

      <footer>
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" /></svg>Настройки</span>
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.8 9a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1.2.9-1.2 1.8M12 17h.01" /></svg>Справка</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
