<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank AI</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="shell" data-layout="workbench">
      <header class="app-bar">
        <div class="brand-lockup">
          <img class="brand-icon" src="/assets/icon.svg" alt="" width="32" height="32" />
          <div class="brand-copy">
            <strong>Bank AI</strong>
            <span id="app-version"></span>
          </div>
        </div>
        <div class="ready-state">
          <span class="status-dot" aria-hidden="true"></span>
          <strong id="status-heading">Готов к работе</strong>
        </div>
      </header>

      <div class="content">
        <section class="context-strip" aria-label="Состояние помощника">
          <p id="status" class="status" role="status" aria-live="polite">Выделите текст и выберите действие.</p>
        </section>

        <section class="workspace" aria-labelledby="actions-title">
          <header class="workspace-heading">
            <div>
              <h1 id="actions-title">Работа с текстом</h1>
              <p>Выберите действие для выделенного фрагмента.</p>
            </div>
            <span class="selection-hint">Word</span>
          </header>
          <div id="actions" class="actions" aria-label="AI-действия"></div>

          <section class="tone-panel" aria-label="Изменение тона">
            <label for="tone-select">Тон текста</label>
            <div class="tone-actions">
              <select id="tone-select" aria-label="Тон текста">
                <option value="neutral">Нейтральный</option><option value="polite">Вежливый</option>
                <option value="strict">Строгий</option><option value="diplomatic">Дипломатичный</option>
              </select>
              <button id="tone-apply" type="button">Изменить</button>
            </div>
          </section>
        </section>

        <section id="preview" class="preview is-empty" aria-labelledby="preview-title">
          <header class="preview-heading">
            <div>
              <h2 id="preview-title">Изменения</h2>
              <p>Проверьте исправления перед применением.</p>
            </div>
            <span class="info" title="Удалённый текст отмечен красным, добавленный — зелёным">i</span>
          </header>
          <div class="comparison-card comparison-body">
            <p id="changes" data-placeholder="Результат появится здесь после обработки текста."></p>
          </div>
          <div id="grammar-meta" class="grammar-meta" hidden></div>
          <div id="grammar-issues" class="grammar-issues" hidden></div>
          <div class="decision-row">
            <button id="reject" class="secondary" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 9A8 8 0 1 1 5 16" /></svg>
              Отклонить
            </button>
            <button id="accept" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
              <span id="accept-label">Применить</span>
            </button>
          </div>
        </section>
      </div>

      <footer class="app-footer">
        <span>Настройки — в приложении Bank AI</span>
        <span>Локальная обработка</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
