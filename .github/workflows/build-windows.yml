name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release checks
        run: npm run release:check

      - name: Generate SBOM
        run: npm run sbom

      - name: Verify SBOM
        run: npm run verify:sbom

      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BankAI-Windows-x64
          path: packages/desktop-host/release/BankAI-Setup-*.exe
          if-no-files-found: error

      - name: Verify installer
        run: npm run verify:installer

      - name: Upload installer checksum
        uses: actions/upload-artifact@v4
        with:
          name: BankAI-Windows-x64-checksum
          path: packages/desktop-host/release/BankAI-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: BankAI-SBOM
          path: release/sbom.cdx.json
          if-no-files-found: error
